name: fess_pos
description: >-
  FESS POS merchant site verification: a host-agnostic Flutter module and the
  only package a host depends on (docs/03 §3).
version: 0.1.0
publish_to: none
repository: https://github.com/FidelityEss/fess-pos

# Floor = the FESS app (docs/03 §7, findings/03 §1–2): Dart >= 3.8,
# Flutter >= 3.29. Lower bounds stay at or below FESS's locked versions.
environment:
  sdk: ^3.8.0
  flutter: ">=3.29.0"

dependencies:
  camera: ^0.11.0
  connectivity_plus: ^7.0.0
  # FESS overrides device_info_plus to 11.5.0 and package_info_plus to 8.0.2.
  device_info_plus: ^11.5.0
  drift: ^2.28.0
  fess_pos_engine:
    path: ../fess_pos_engine
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  # FESS pins these exactly: flutter_secure_storage 9.2.4, geolocator 14.0.1.
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.1
  meta: ^1.15.0
  package_info_plus: ^8.0.2
  path: ^1.9.0
  path_provider: ^2.1.4
  sentry: ^9.0.0
  sqlcipher_flutter_libs: ^0.6.8
  # sqlite3 3.x needs Dart >= 3.10 and replaces sqlcipher_flutter_libs with
  # build hooks; stay on 2.x until FESS is on Dart 3.10 (D-51).
  sqlite3: ^2.9.0

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.28.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
